name: Build KIKI Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KIKI_X_PROJECT_V4 KIKI_X_PROJECT_V4.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KIKI_X_PROJECT_V4-Owner-EXE
          path: dist/KIKI_X_PROJECT_V4.exe
          if-no-files-found: error
          retention-days: 14
